# ============================================================================
# Centralized Master Configuration — Telecom Agentic AI Demo (UC-001)
# Compliant with AGENTS.md Part 2.5, Part 3.1, Part 5, and ADR-TELCO-UC001-ACT03-V1
# ============================================================================

project:
  name: "telecom-agentic-ai-demo"
  prefix: "telco-agent"
  use_case_id: "UC-001"
  use_case_title: "Enterprise L2 Fiber Packet-Loss Triage & Automated Optical DDM Recalibration"
  environment: "local"

gcp:
  project_id: "telecom-agentic-ai-demo"
  region: "europe-west4"
  artifact_bucket_name: "telecom-agentic-ai-demo-bkt-artifacts"
  runtime_service_account: "telco-agent-sa-runtime"

logging:
  level: "INFO"
  log_dir: "logs"
  log_filename: "telco_agent.log"
  max_bytes: 5242880
  backup_count: 3

paths:
  raw_sources_dir: "data/raw_sources"
  sql_subdir: "sql"
  excel_subdir: "excel"
  pdf_subdir: "pdf"
  sop_subdir: "sop"
  manifest_filename: "STAGE0_ARTIFACT_MANIFEST.md"

stage0:
  seed: 42
  sql_db_filename: "cmdb_installed_base.db"
  sql_dump_filename: "cmdb_dump.sql"
  excel_catalog_filename: "Telco_Master_Product_SLA_Catalog_2026.xlsx"
  hw_manual_pdf_filename: "Vendor_Optical_Hardware_Manual_v4.pdf"
  msa_contract_pdf_filename: "MSA_Contract_A_Corporate_Enterprise_2026.pdf"
  sop_runbook_docx_filename: "SOP_NOC_Master_Assurance_Runbook_v2026.docx"
  sop_runbook_md_filename: "SOP_NOC_Master_Assurance_Runbook_v2026.md"
  target_customer_id: "CUST-ENT-409"
  target_customer_legal_name: "A Corporate Enterprise"
  target_customer_bv_name: "A Corporate Enterprise B.V."
  target_customer_kvk: "NL-8841209"
  target_circuit_id: "CIR-994821"
  target_product_sku: "ETH-10G-GOLD"
  target_upgrade_sku: "ETH-100G-PLATINUM"
  target_pe_router: "NLD-HAG-PE02"
  target_olt_port: "OLT04-P12"
  target_rfs_id: "RFS-OLT04-P12"
  target_cpe_asset_id: "CPE-ASN-7741"
  target_cpe_model_sku: "NOK-7210-SAS-Mxp"
  target_sop_id: "SOP-ASSUR-402"

ai:
  model_name: "gemini-3.8-flash"
  component_models:
    track_b_cmdb_profiler: "gemini-3.8-flash"
    track_b_excel_profiler: "gemini-3.8-flash"
    track_b_pdf_bites: "gemini-3.8-flash"
    layer1_orchestrator: "gemini-3.8-flash"
    layer3_nl2semantics: "gemini-3.8-flash"
  location: "global"
  temperature: 0.0
  max_output_tokens: 4096
  thinking_budget: 1024

# ============================================================================
# Activity 0.3 Locked Component Architecture Settings (Step 1)
# ============================================================================

use_case:
  use_case_id: "UC-001"
  title: "Enterprise L2 Fiber Packet-Loss Triage & Automated Optical DDM Recalibration"
  customer_name: "A Corporate Enterprise"
  customer_id: "CUST-ENT-409"
  customer_bv_name: "A Corporate Enterprise B.V."
  customer_registration_kvk: "NL-8841209"
  circuit_id: "CIR-994821"
  active_product_sku: "ETH-10G-GOLD"
  expired_product_sku: "ETH-1G-SILVER"
  cfs_expired_row_id: 2000
  cfs_active_row_id: 2001
  pe_router_hostname: "NLD-HAG-PE02"
  olt_port_id: "OLT04-P12"
  rfs_id: "RFS-OLT04-P12"
  cpe_asset_id: "CPE-ASN-7741"
  cpe_model_sku: "NOK-7210-SAS-Mxp"
  sop_id: "SOP-ASSUR-402"

layer1_orchestrator:
  option_id: "1D"
  transport_mode: "in_process"
  sse_port: 8000
  llm_model: "gemini-3.8-flash"
  export_ai_studio_schema_path: "reports/ai_studio_tool_declarations.json"

layer2_worker_and_sop:
  compiler_option_id: "2.1D-Catalog"
  runtime_option_id: "2.2A"
  active_skill_path: "skills/skill_sop_402.yaml"
  active_guardrails_path: "skills/guardrails_sop_402.json"
  missing_primitive_spec_path: "reports/missing_primitive_spec.json"
  hitl_sop_review_report_path: "reports/hitl_sop_skill_review.html"
  mcp_catalog_path: "config/mcp_primitives_catalog.json"

layer3_nl2semantics:
  option_id: "3C-Dual"
  execution_mode: "dual_comparison"

layer4_compiler_federation:
  option_id: "4A"
  dataset_trig_path: "data/semantic_store/knowledge_graph.trig"
  tbox_path: "data/semantic_store/tbox_sid_etom.ttl"
  r2rml_path: "mappings/cmdb_r2rml.ttl"
  excel_rml_path: "mappings/excel_catalog_rml.yaml"
  shapes_dir: "shapes"
  sqlite_db_path: "data/raw_sources/sql/cmdb_installed_base.db"
  layer4_federation_proof_report_path: "reports/layer4_federation_proof_report.html"

track_b_ingestion_and_er:
  option_id: "5A-HITL"
  use_case_charter_path: "data/raw_sources/uc001_use_case_charter.md"
  tmf_sid_etom_vocab_path: "data/reference_standards/tmf_sid_etom_vocab.json"
  gate1_candidate_proposal_path: "data/semantic_store/gate1_candidate_proposal.json"
  profiler_prompt_template_path: "prompts/s1_cmdb_schema_profiler_prompt.md"
  excel_profiler_prompt_template_path: "prompts/s2_excel_catalog_profiler_prompt.md"
  pdf_bites_prompt_template_path: "prompts/s3_pdf_bites_extractor_prompt.md"
  gate2_candidate_proposal_path: "data/semantic_store/gate2_candidate_proposal.json"
  er_review_band_min: 0.85
  er_review_band_max: 0.95
  hitl_gate1_report_path: "reports/hitl_gate1_ontology_mapping_review.html"
  hitl_gate2_report_path: "reports/hitl_gate2_ingestion_er_curation.html"
  shacl_quarantine_report_path: "reports/shacl_quarantine_report.html"
  shacl_quarantine_summary_path: "reports/shacl_quarantine_summary.json"

cqrs_action_plane:
  option_id: "6A-Generic"
  state_file_path: "data/cqrs_state/cqrs_runtime_state.json"
  active_telemetry_preset: "branch_a_soft_degradation"
  rate_limit_max_tokens: 3
  rate_limit_window_seconds: 300
  mutex_ttl_seconds: 60
