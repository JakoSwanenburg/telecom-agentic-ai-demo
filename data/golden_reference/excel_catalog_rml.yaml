mapping_rationale: The B2B_Enterprise_SLA_Matrix worksheet provides authoritative
  service specification records for Enterprise Layer 2 and IP-VPN products governed
  by Use Case UC-001. Rows 1 to 4 contain title banners, merged headers, and whitespace,
  placing the tabular column headers at row 5 and the first data instance at row 6.
  Commercial SKU identifiers in Product_SKU_Code form the canonical entity IRI (urn:telco:catalog:spec:{Product_SKU_Code})
  and map to tmf:ServiceSpecification. Quality of service metrics and SLA bounds are
  normalized to typed TBox properties, while ERP accounting and unstructured notes
  are excluded as noise.
